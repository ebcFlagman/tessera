services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: tessera, POSTGRES_PASSWORD: tessera, POSTGRES_DB: tessera }
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment: { KC_BOOTSTRAP_ADMIN_USERNAME: admin, KC_BOOTSTRAP_ADMIN_PASSWORD: admin }
    ports: ['8080:8080']
    volumes: ['./keycloak/tessera-realm.json:/opt/keycloak/data/import/tessera-realm.json:ro']
volumes:
  pgdata:
